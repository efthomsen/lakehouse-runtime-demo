[project]
name = "lakehouse-runtime"
version = "0.2.0"
description = "The shipped workload: paginate a source API, validate, append to a Bronze Delta table via delta-rs."
requires-python = ">=3.12,<3.13"
dependencies = [
    "deltalake==1.6.3",
    "pyarrow==25.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingestion", "silver"]
