[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lakehouse-runtime-demo"
version = "0.1.0"
description = "Reference architecture for Boundaries of the Lakehouse: Azure Batch + delta-rs + Fabric MLVs"
requires-python = ">=3.11"
dependencies = [
    "deltalake>=0.20",
    "pyarrow>=16",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
