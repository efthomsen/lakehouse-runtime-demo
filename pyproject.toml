[project]
name = "lakehouse-runtime-demo"
version = "0.2.0"
description = "Reference architecture for Boundaries of the Lakehouse: Azure Batch + delta-rs + Fabric Materialized Lake Views"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "deltalake==1.6.3",
    "pyarrow==25.0.1",
]

[project.optional-dependencies]
azure = [
    "azure-batch==15.1.0",
    "azure-identity==1.25.3",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingestion", "silver", "orchestration"]

[tool.pytest.ini_options]
testpaths = ["tests/core"]
addopts = "-ra"
